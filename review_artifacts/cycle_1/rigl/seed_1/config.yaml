  lr: 0.03
  momentum: 0.0
evaluation:
  eval_every_steps: 2
  eval_batches: 1
output:
  root: results
algorithm:
  rewire_interval: 5
  rewire_fraction: 0.1
runtime_seconds: 0.18991570896469057
