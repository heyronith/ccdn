experiment: {name: pmnist, seed: 1, device: auto, deterministic: true}
stream: {dataset_root: ./data, permutations: 20, batches_per_permutation: 20, batch_size: 128}
model: {type: continual_backprop, hidden_sizes: [256, 256]}
algorithm: {replacement_interval: 100, replacement_fraction: 0.01, maturity: 100, utility_decay: 0.99}
optimizer: {type: sgd, lr: 0.01, momentum: 0.0}
evaluation: {eval_every_steps: 10, eval_batches: 2}
output: {root: results}
