[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccdn"
version = "0.1.0"
description = "Reproducible continual-learning experiments for CCDN research"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["ccdn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
